[project]
name = "pneumofinder-api"
version = "1.0.0"
description = "API RESTful para diagnóstico de pneumonia usando CNNs"
authors = [
    {name = "Cauã Farias", email = ""}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}

dependencies = [
    "absl-py==2.2.2",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.12.14",
    "aiohttp-retry==2.9.1",
    "aiosignal==1.4.0",
    "astunparse==1.6.3",
    "attrs==25.3.0",
    "blinker==1.9.0",
    "certifi==2025.1.31",
    "charset-normalizer==3.4.1",
    "click==8.1.8",
    "colorama==0.4.6",
    "flask==3.1.0",
    "flask-cors==5.0.1",
    "flatbuffers==25.2.10",
    "frozenlist==1.7.0",
    "gast==0.6.0",
    "git-filter-repo==2.47.0",
    "google-pasta==0.2.0",
    "grpcio==1.71.0",
    "h5py==3.13.0",
    "idna==3.10",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "keras==3.9.2",
    "libclang==18.1.1",
    "markdown==3.8",
    "markdown-it-py==3.0.0",
    "markupsafe==3.0.2",
    "mdurl==0.1.2",
    "ml-dtypes==0.5.1",
    "multidict==6.6.3",
    "namex==0.0.8",
    "numpy==2.1.3",
    "opt-einsum==3.4.0",
    "optree==0.15.0",
    "packaging==25.0",
    "pillow==11.2.1",
    "propcache==0.3.2",
    "protobuf==5.29.4",
    "pygments==2.19.1",
    "pyjwt==2.10.1",
    "python-dotenv==1.1.1",
    "requests==2.32.3",
    "rich==14.0.0",
    "setuptools==78.1.1",
    "six==1.17.0",
    "tensorboard==2.19.0",
    "tensorboard-data-server==0.7.2",
    "tensorflow==2.19.0",
    "termcolor==3.0.1",
    "twilio==9.7.0",
    "typing-extensions==4.13.2",
    "urllib3==2.4.0",
    "werkzeug==3.1.3",
    "wheel==0.45.1",
    "wrapt==1.17.2",
    "yarl==1.20.1",
    "opencv-python==4.10.0.84",
    "matplotlib==3.10.0",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase (Portuguese naming)
    "N803",   # argument name should be lowercase (Portuguese naming)
    "N806",   # variable in function should be lowercase (Portuguese naming)
    "N815",   # variable in class scope should not be mixedCase (Portuguese naming)
    "N816",   # variable in global scope should not be mixedCase (Portuguese naming)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
